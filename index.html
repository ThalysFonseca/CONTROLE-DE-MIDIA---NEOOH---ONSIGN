<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Mídia - NEOOH</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container wide">
        <div class="logo">NEOOH</div>
        <h2>Controle do Player</h2>
        <p id="status" class="status-text">Escolha uma mídia para exibir agora</p>

        <!-- Os 8 botões são gerados pelo script.js a partir da lista MIDIAS -->
        <div id="grid" class="grid"></div>

        <button id="stopBtn" class="btn-stop" type="button">Voltar ao Loop Principal (Atmosphera)</button>
    </div>
</body>
</html>
